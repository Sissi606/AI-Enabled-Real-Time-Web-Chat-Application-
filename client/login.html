<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="/style.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
  </head>
  <body class="login-page">
    <div id = "app-view">
        <div id = "page-view" class="login-view">
          <div class="login-card">
            <h1>Welcome Back</h1>
            <p class="login-subtitle">Log in to continue chatting.</p>
            <p id="login-error-message" class="login-error-message" aria-live="polite"></p>
            <form method="POST" action="/login" class="login-form">
              <label for="login-username">Username</label>
              <input id="login-username" type="text" name="username" placeholder="Enter your username" autocomplete="username" required>

              <label for="login-password">Password</label>
              <input id="login-password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

              <button type="submit" class="login-button">Login</button>
            </form>
          </div>
        </div>
    </div>
    <script>
      (function showLoginErrorPopup() {
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        if (!error) return;
        const errorElem = document.getElementById('login-error-message');
        if (!errorElem) return;

        if (error === 'username') {
          errorElem.textContent = 'Incorrect username. Please try again.';
        } else if (error === 'password') {
          errorElem.textContent = 'Incorrect password. Please try again.';
        } else {
          errorElem.textContent = 'Login failed. Please try again.';
        }

        errorElem.classList.add('visible');

        window.history.replaceState({}, document.title, '/login');
      })();
    </script>
  </body>
</html>
